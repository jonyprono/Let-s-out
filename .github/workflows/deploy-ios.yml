name: Build and Deploy iOS to App Store Connect

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to TestFlight & App Store
    runs-on: macos-14

    steps:
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web app
        run: pnpm --filter @letsout/web build

      - name: Sync Capacitor iOS
        working-directory: apps/web
        run: npx cap sync ios

      - name: Save App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Create Distribution Certificate via App Store Connect API
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          # 1. Create keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="ci_keychain_pass_$(date +%s)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db /Library/Keychains/System.keychain
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

          # 2. Generate RSA private key + CSR
          openssl genrsa -out /tmp/dist_key.pem 2048
          openssl req -new -key /tmp/dist_key.pem \
            -subj "/CN=iOS Distribution/OU=${APPSTORE_ISSUER_ID}/O=GWZQYSN37A/C=US" \
            -out /tmp/dist_request.csr
          CSR_CONTENT=$(base64 /tmp/dist_request.csr | tr -d '\n')

          # 3. Generate JWT for App Store Connect API
          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$APPSTORE_KEY_ID" \
            | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          IAT=$(date +%s)
          EXP=$((IAT + 1200))
          PAYLOAD=$(printf '{"iss":"%s","iat":%d,"exp":%d,"aud":"appstoreconnect-v1"}' \
            "$APPSTORE_ISSUER_ID" "$IAT" "$EXP" \
            | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" \
            | openssl dgst -sha256 -sign "$KEY_PATH" \
            | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          JWT="$HEADER.$PAYLOAD.$SIG"

          # 4. Submit CSR to Apple → get Distribution certificate
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"type\":\"certificates\",\"attributes\":{\"certificateType\":\"IOS_DISTRIBUTION\",\"csrContent\":\"$CSR_CONTENT\"}}}" \
            "https://api.appstoreconnect.apple.com/v1/certificates")

          echo "API Response: $RESPONSE" | head -c 500

          CERT_CONTENT=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['data']['attributes']['certificateContent'])" 2>&1)

          if [ -z "$CERT_CONTENT" ] || echo "$CERT_CONTENT" | grep -q "Error\|error"; then
            echo "ERROR: Failed to create certificate"
            echo "$RESPONSE"
            exit 1
          fi

          # 5. Decode certificate and combine with private key into .p12
          echo "$CERT_CONTENT" | base64 --decode > /tmp/distribution.cer
          P12_PASS="ci_p12_pass"
          openssl pkcs12 -export \
            -inkey /tmp/dist_key.pem \
            -in /tmp/distribution.cer \
            -out /tmp/distribution.p12 \
            -passout "pass:$P12_PASS" \
            -legacy 2>/dev/null || \
          openssl pkcs12 -export \
            -inkey /tmp/dist_key.pem \
            -in /tmp/distribution.cer \
            -out /tmp/distribution.p12 \
            -passout "pass:$P12_PASS"

          # 6. Import .p12 into keychain
          security import /tmp/distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Cleanup sensitive files
          rm -f /tmp/dist_key.pem /tmp/dist_request.csr /tmp/distribution.cer /tmp/distribution.p12

          echo "✅ Distribution certificate imported successfully"

      - name: Archive app
        working-directory: apps/web/ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "./build/LetsOut.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=GWZQYSN37A \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Export IPA
        working-directory: apps/web/ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          xcodebuild -exportArchive \
            -archivePath "./build/LetsOut.xcarchive" \
            -exportOptionsPlist "ExportOptions.plist" \
            -exportPath "./build/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload to App Store Connect
        working-directory: apps/web/ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          IPA_PATH=$(find ./build/export -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"


