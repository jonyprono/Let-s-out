name: Build and Deploy Android to Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  JAVA_VERSION: "21"

jobs:
  deploy-android:
    name: Build & Deploy Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @letsout/web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Sync Capacitor Android
        run: npx cap sync android
        working-directory: apps/web

      - name: Build signed Android App Bundle (AAB)
        run: ./gradlew bundleRelease
        working-directory: apps/web/android

      - name: Increment versionCode
        run: |
          FILE="apps/web/android/app/build.gradle"
          CURRENT=$(grep "versionCode" $FILE | grep -o '[0-9]*')
          NEW=$((CURRENT + 1))
          sed -i "s/versionCode $CURRENT/versionCode $NEW/" $FILE
          echo "Version code bumped from $CURRENT to $NEW"

      - name: Upload AAB to Google Play (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fihodecorp.letsout
          releaseFiles: apps/web/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
